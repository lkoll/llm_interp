[project]
name = "llm-interp"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "transformers==5.19.0",
    "zarr==3.4.1",
    "pyarrow==26.0.0",
    "duckdb==1.5.6",
    "pydantic==2.14.1",
    "datasets==5.1.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
notebook = [
    "matplotlib==3.11.2",
    "ipykernel==7.4.0",
]

[project.scripts]
llm-interp = "llm_interp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_interp"]

[tool.pytest.ini_options]
addopts = "-m 'not gpu'"
markers = [
    "gpu: integration tests that require a CUDA GPU",
]
